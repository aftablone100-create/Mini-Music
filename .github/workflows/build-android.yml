name: Build Mini Music APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create & Configure Cordova Project
        run: |
          cordova create mini_app_v2 com.minimusic.appv2 "Mini Music Pro"
          cp index.html style.css app.js mini_app_v2/www/
          
          # Copy custom icon if present
          if [ -f "icon.png" ]; then
            cp icon.png mini_app_v2/www/icon.png
            sed -i '/<\/widget>/i \    <icon src="www/icon.png" \/>' mini_app_v2/config.xml
          fi

          cd mini_app_v2
          cordova platform add android

      - name: Build Debug APK
        run: |
          cd mini_app_v2
          cordova build android --debug

      - name: Align and Sign APK (V2 Scheme)
        run: |
          # Generate Signing Key
          keytool -genkey -v -keystore release.keystore \
            -alias minimusic -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass mypassword -keypass mypassword \
            -dname "CN=MiniMusic, OU=Dev, O=Dev, L=City, ST=State, C=US"
          
          # Locate build tools
          BUILD_TOOLS_PATH=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          
          # Zipalign the APK
          $BUILD_TOOLS_PATH/zipalign -v 4 \
            mini_app_v2/platforms/android/app/build/outputs/apk/debug/app-debug.apk \
            aligned.apk
            
          # Sign using apksigner
          $BUILD_TOOLS_PATH/apksigner sign --ks release.keystore \
            --ks-pass pass:mypassword \
            --out mini-music-pro.apk aligned.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: mini-music-v2-apk
          path: mini-music-pro.apk
          

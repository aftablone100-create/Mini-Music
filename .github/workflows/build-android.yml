name: Build Mini Music APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create Keystore for Signed APK
        run: |
          keytool -genkey -v -keystore release.keystore \
            -alias minimusic -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass mypassword -keypass mypassword \
            -dname "CN=MiniMusic, OU=Dev, O=Dev, L=City, ST=State, C=US"

      - name: Install Cordova & Tools
        run: |
          npm install -g cordova cordova-res

      - name: Create & Configure Cordova Project
        run: |
          # Change "mini_app_v2" and "com.minimusic.appv2" to make it a completely separate app
          cordova create mini_app_v2 com.minimusic.appv2 "Mini Music Pro"
          cp index.html style.css app.js mini_app_v2/www/
          
          # Copy custom icon if present
          if [ -f "icon.png" ]; then
            cp icon.png mini_app_v2/www/icon.png
            echo '<icon src="www/icon.png" />' >> mini_app_v2/config.xml
          fi

          cd mini_app_v2
          cordova platform add android

      - name: Build Signed APK
        run: |
          cd mini_app_v2
          cordova build android --release -- \
            --keystore="../release.keystore" \
            --storePassword="mypassword" \
            --alias="minimusic" \
            --password="mypassword"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mini-music-v2-apk
          path: mini_app_v2/platforms/android/app/build/outputs/apk/release/app-release.apk
          

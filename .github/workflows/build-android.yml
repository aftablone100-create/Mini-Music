name: Build Mini Music APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create & Build Cordova Project
        run: |
          cordova create mini_app com.minimusic.app "Mini Music"
          cp index.html style.css app.js mini_app/www/
          cd mini_app
          cordova platform add android
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mini-music-apk
          path: mini_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          
